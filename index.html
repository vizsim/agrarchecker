<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <title>Agrarchecker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="tractor-svgrepo-com.svg" type="image/svg+xml">
  <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css' />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="map"></div>

  <!-- ============================================================
       Rechtes Panel: Legende + Filter
  ============================================================= -->
  <div class="legend">

    <!-- ===== Header ===== -->
    <div class="legend-header legend-title" data-toggle="legend-root">
      <div class="legend-title-text">
        <div class="legend-heading">
          <img src="tractor-svgrepo-com.svg" alt="" />
          <span>Agrarchecker</span>
        </div>
        <div class="legend-subtext">
          Anbaukulturen in Deutschland 2019–2022
          <span class="info-icon"
            title="Quelle: Schwieder, M., Tetteh, G. O., Blickensdörfer, L., Gocht, A., & Erasmi, S. (2024). Agricultural land use: National-scale crop type maps for Germany from combined time series of Sentinel-1, Sentinel-2 and Landsat data (2017 to 2021) (Version v202) [Data set]. Zenodo. https://doi.org/10.5281/zenodo.10640528 – Lizenz: Creative Commons Attribution 4.0 International">ⓘ</span>
          <span class="source-credit">Thünen-Institut</span>
        </div>
      </div>
      <span class="toggle-arrow toggle-root open" data-arrow="legend-root"></span>
    </div>

    <div class="legend-section-divider"></div>

    <!-- ===== Sektion: Anbaukulturen (Hauptdaten) ===== -->
    <div class="legend-section" data-section="kulturen">
      <div class="legend-section-title section-toggle" data-section-id="kulturen">
        <span>Anbaukulturen</span>
        <span class="toggle-arrow section-arrow open" data-arrow="kulturen"></span>
      </div>
      <div class="legend-section-content">

        <!-- Jahr-Auswahl -->
        <div class="year-picker">
          <div class="year-picker-head">
            <span>Jahr</span>
            <span class="year-picker-value" id="agrar-layer-year">2019</span>
          </div>
          <input type="range" id="agrar-layer-slider" min="2019" max="2022" step="1" value="2019" />
          <div class="year-picker-ticks">
            <span>2019</span><span>2020</span><span>2021</span><span>2022</span>
          </div>
        </div>

        <!-- Kulturarten-Filter (generiert aus js/cropTypes.js) -->
        <div id="crop-filter"></div>

      </div>
    </div>

    <div class="legend-section-divider"></div>

    <!-- ===== Sektion: Kontext ===== -->
    <div class="legend-section" data-section="kontext">
      <div class="legend-section-title section-toggle" data-section-id="kontext">
        <span>Kontext</span>
        <span class="toggle-arrow section-arrow open" data-arrow="kontext"></span>
      </div>
      <div class="legend-section-content">

        <div class="legend-section-subtitle">Straßenfotos</div>

        <label class="legend-check">
          <input type="checkbox" id="toggle-mapillary" />
          <span>Mapillary-Bilder anzeigen</span>
          <span class="info-icon" title="Quelle: Mapillary Coverage – Lizenz: CC BY-SA 4.0">ⓘ</span>
        </label>

        <div id="mapillary-filter-options" class="mapillary-filter">
          <label class="legend-check">
            <input type="checkbox" id="mapillary-nonpano" />
            <span class="crop-swatch" style="background:#00b955"></span>
            <span>normale Bilder</span>
          </label>
          <label class="legend-check">
            <input type="checkbox" id="mapillary-pano" />
            <span class="crop-swatch" style="background:#0077ff"></span>
            <span>Panorama-Bilder</span>
          </label>
        </div>

      </div>
    </div>

    <div class="legend-section-divider"></div>

    <!-- ===== Sektion: Analyse (sichtbarer Ausschnitt) ===== -->
    <div class="legend-section collapsed" data-section="analyse">
      <div class="legend-section-title section-toggle" data-section-id="analyse">
        <span>Analyse</span>
        <span class="toggle-arrow section-arrow" data-arrow="analyse"></span>
      </div>
      <div class="legend-section-content">
        <div id="crop-analysis">
          <div class="analysis-summary" id="analysis-summary"></div>
          <div class="analysis-chart-wrap">
            <canvas id="analysis-chart"></canvas>
          </div>
          <div class="analysis-list" id="analysis-list"></div>
          <div class="analysis-hint" id="analysis-hint"></div>
        </div>
      </div>
    </div>

    <div class="legend-section-divider"></div>

    <!-- ===== Fußzeile ===== -->
    <div id="feature-count-wrapper">
      <div id="feature-count">
        <div>Zoomlevel: …</div>
      </div>
      <a href="https://blaaa" target="_blank" rel="noopener noreferrer" title="Fehler melden oder Feedback geben">
        <img src="https://img.shields.io/badge/Status-Experimental-red" alt="Status: Experimental" />
      </a>
    </div>

  </div>

  <!-- ============================================================
       Unten links: Navigation + Karten-Panel
  ============================================================= -->
  <div id="bottom-left-ui-container">
    <div id="custom-nav-control"></div>
  </div>

  <button id="map-settings-toggle" class="map-settings-toggle" type="button"
    aria-expanded="false" aria-controls="map-settings-panel" title="Kartenauswahl">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21 1 6"></polygon>
      <line x1="8" y1="3" x2="8" y2="18"></line>
      <line x1="16" y1="6" x2="16" y2="21"></line>
    </svg>
  </button>

  <section id="map-settings-panel" class="map-settings-panel is-collapsed" aria-label="Kartenauswahl">
    <div class="map-settings-panel-content">
      <div class="basemap-grid">
        <button class="basemap-btn selected" type="button" data-basemap="positron">
          <span class="basemap-preview basemap-preview-positron"></span>
          <span class="basemap-label">Positron</span>
        </button>
        <button class="basemap-btn" type="button" data-basemap="osm">
          <span class="basemap-preview basemap-preview-osm"></span>
          <span class="basemap-label">OSM Carto</span>
        </button>
        <button class="basemap-btn" type="button" data-basemap="satellite">
          <span class="basemap-preview basemap-preview-satellite"></span>
          <span class="basemap-label">Esri</span>
        </button>
      </div>

      <div class="terrain-row">
        <div><strong>Geländerelief</strong>
          <p>3D-Oberfläche + Hillshade (Mapterhorn)</p>
        </div>
        <label class="switch"><input id="toggle-relief" type="checkbox" /><span class="switch-slider"></span></label>
      </div>

      <div class="terrain-row">
        <div><strong>3D-Gebäude</strong>
          <p>Ab Zoom 14 sichtbar (OpenFreeMap)</p>
        </div>
        <label class="switch"><input id="toggle-buildings" type="checkbox" /><span class="switch-slider"></span></label>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <script type="module" src="./main.js"></script>
</body>

</html>
